
name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ vars.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
      - name: Deploy to VPS
        run: |
          ssh ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} << EOF
          cd /home/telegrambot/pauseless/pauseless


          # Ensure correct Python version
          export PATH="\$HOME/.local/bin:\$PATH"
          poetry env use python3

          # Install dependencies based on poetry.lock and pyproject.toml
          poetry install --no-root

          # Restart the bot service
          systemctl restart pauseless.service
          EOF